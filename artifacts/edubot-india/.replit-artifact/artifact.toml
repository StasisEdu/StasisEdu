kind = "web"
previewPath = "/"
title = "EduBot India"
version = "1.0.0"
id = "artifacts/edubot-india"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21350

[services.development]
run = "pnpm --filter @workspace/edubot-india run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edubot-india", "run", "build" ]
publicDir = "artifacts/edubot-india/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21350"
BASE_PATH = "/"
