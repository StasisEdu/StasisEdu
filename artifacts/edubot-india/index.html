<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>StasisEducation</title>
    <meta
      name="description"
      content="StasisEducation — AI-powered CBSE tutor for Classes 6-10. Level up your learning with gamified practice."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="StasisEducation" />
    <meta
      property="og:description"
      content="AI-powered CBSE tutor for Classes 6-10."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas
      id="bgCanvas"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      "
    ></canvas>

    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <span class="logo">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          StasisEducation
        </span>
      </div>
      <div class="header-right">
        <div class="level-pill" id="levelPill">🌱 Rookie</div>
        <div class="xp-bar-wrap">
          <div class="xp-bar" id="xpBar" style="width: 0%"></div>
        </div>
        <div class="streak-wrap">🔥 <span id="streakCount">0</span></div>
        <div class="gems-wrap">💎 <span id="gemsCount">0</span></div>
        <button
          id="themeToggle"
          class="theme-toggle"
          title="Toggle theme"
          onclick="toggleTheme()"
        >
          🌙
        </button>
      </div>
    </header>

    <!-- Sidebar Nav -->
    <nav id="bottomNav">
      <button
        class="nav-btn active"
        data-page="landing"
        onclick="navigate('landing')"
      >
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </button>
      <button
        class="nav-btn"
        data-page="practice"
        onclick="navigate('practice')"
      >
        <span class="nav-icon">📝</span>
        <span>Practice</span>
      </button>
      <button class="nav-btn" data-page="saved" onclick="navigate('saved')">
        <span class="nav-icon">💾</span>
        <span>Saved</span>
      </button>
      <button class="nav-btn" data-page="stats" onclick="navigate('stats')">
        <span class="nav-icon">📊</span>
        <span>Stats</span>
      </button>
      <button
        class="nav-btn"
        data-page="leaderboard"
        onclick="navigate('leaderboard')"
      >
        <span class="nav-icon">🏆</span>
        <span>Ranks</span>
      </button>
      <button class="nav-btn" data-page="games" onclick="navigate('games')">
        <span class="nav-icon">🎮</span>
        <span>Games</span>
      </button>
      <button
        class="nav-btn"
        data-page="resources"
        onclick="navigate('resources')"
      >
        <span class="nav-icon">📄</span>
        <span>Papers</span>
      </button>
      <button class="nav-btn" data-page="leagues" onclick="navigate('leagues')">
        <span class="nav-icon">⚔️</span>
        <span>Leagues</span>
      </button>

      <!-- Features collapsible section -->
      <div
        style="
          margin-top: 8px;
          border-top: 1px solid rgba(255, 255, 255, 0.06);
          padding-top: 8px;
        "
      >
        <button
          id="featuresToggleBtn"
          onclick="toggleFeaturesNav()"
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            padding: 10px 12px;
            border-radius: 10px;
            transition: all 0.18s;
          "
          onmouseover="this.style.background='var(--surface-hover)';this.style.color='var(--text)'"
          onmouseout="this.style.background='none';this.style.color='var(--text-muted)'"
        >
          <span style="display: flex; align-items: center; gap: 10px">
            <span style="font-size: 1.05rem; width: 20px; text-align: center"
              >🚀</span
            >
            <span>Features</span>
          </span>
          <span
            id="featuresChevron"
            style="font-size: 0.7rem; transition: transform 0.22s"
            >▼</span
          >
        </button>
        <div id="featuresNavList" style="display: none; padding-left: 4px">
          <button class="nav-btn" onclick="navigate('voice-doubt')">
            <span class="nav-icon">🎙️</span><span>Voice Doubt</span>
          </button>
          <button class="nav-btn" onclick="navigate('revision')">
            <span class="nav-icon">📅</span><span>Revision Plan</span>
          </button>
          <button class="nav-btn" onclick="navigate('trends')">
            <span class="nav-icon">📊</span><span>PYQ Trends</span>
          </button>
          <button class="nav-btn" onclick="navigate('mock-test')">
            <span class="nav-icon">📝</span><span>Mock Test</span>
          </button>
          <button class="nav-btn" onclick="navigate('mind-map')">
            <span class="nav-icon">🧠</span><span>Mind Map</span>
          </button>
          <button class="nav-btn" onclick="navigate('flashcards')">
            <span class="nav-icon">🃏</span><span>Flashcards</span>
          </button>
          <button class="nav-btn" onclick="navigate('pomodoro')">
            <span class="nav-icon">⏱️</span><span>Study Timer</span>
          </button>
          <button class="nav-btn" onclick="navigate('home')">
            <span class="nav-icon">📸</span><span>Snap & Solve</span>
          </button>
          <button class="nav-btn" onclick="navigate('weaktopics')">
            <span class="nav-icon">🎯</span><span>Weak Topics</span>
          </button>
        </div>
      </div>
    </nav>

    <script>
      function toggleFeaturesNav() {
        const list = document.getElementById("featuresNavList");
        const chevron = document.getElementById("featuresChevron");
        const isOpen = list.style.display !== "none";
        list.style.display = isOpen ? "none" : "block";
        chevron.style.transform = isOpen ? "" : "rotate(180deg)";
      }
    </script>

    <!-- Main Content -->
    <main id="app"></main>

    <!-- Level Up Overlay -->
    <div id="levelUpOverlay" class="hidden">
      <div class="levelup-content">
        <div class="levelup-emoji" id="levelUpEmoji">🏆</div>
        <div class="levelup-title">LEVEL UP!</div>
        <div class="levelup-sub" id="levelUpSub">You reached Scholar!</div>
      </div>
      <canvas id="confettiCanvas"></canvas>
    </div>

    <!-- Badge Toast -->
    <div id="badgeToast" class="hidden">
      <div class="badge-toast-inner">
        <span id="badgeToastEmoji">🎯</span>
        <div>
          <div class="badge-toast-title">Badge Unlocked!</div>
          <div id="badgeToastName">First Solve</div>
        </div>
      </div>
    </div>

    <!-- XP Float -->
    <div id="xpFloat" class="hidden"></div>

    <script type="module" src="/src/main.js"></script>
    <script>
      const THEMES = ["dark", "light", "eye"];
      const ICONS = { dark: "🌙", light: "☀️", eye: "🌿" };
      (function () {
        const saved = localStorage.getItem("stasis_theme") || "dark";
        if (saved !== "dark") document.documentElement.classList.add(saved);
      })();
      function toggleTheme() {
        const html = document.documentElement;
        const cur = localStorage.getItem("stasis_theme") || "dark";
        const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
        html.classList.remove("light", "eye");
        if (next !== "dark") html.classList.add(next);
        localStorage.setItem("stasis_theme", next);
        document.getElementById("themeToggle").textContent = ICONS[next];
      }
      window.addEventListener("DOMContentLoaded", function () {
        const cur = localStorage.getItem("stasis_theme") || "dark";
        document.getElementById("themeToggle").textContent = ICONS[cur];
      });
    </script>
  </body>
</html>
